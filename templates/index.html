<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D Wiki</title>
</head>
<body>
    <h1>Welcome to the D&D Wiki!</h1>
    <ul>
        {% for page in pages %}
            <li><a href="/page/{{ page.id }}">{{ page.title }}</a></li>
        {% endfor %}

        {% if not pages %}
            <li>No pages found.</li>
        {% endif %}
    </ul>
</body>
</html>
